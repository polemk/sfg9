  <path d="M37 47 Q41 45 45 47" stroke="#2d0f0f" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <path d="M55 47 Q59 45 63 47" stroke="#2d0f0f" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <!-- Smile -->
  <path d="M44 65 Q50 72 56 65" stroke="#c97b7b" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <!-- Cheeks -->
  <ellipse cx="33" cy="60" rx="5" ry="3" fill="#f4a6a6" opacity="0.45"/>
  <ellipse cx="67" cy="60" rx="5" ry="3" fill="#f4a6a6" opacity="0.45"/>
