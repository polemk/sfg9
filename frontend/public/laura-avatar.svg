      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <linearGradient id="lauraHair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4b1d1d"/>
      <stop offset="100%" style="stop-color:#2d0f0f"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="50" fill="url(#lauraGrad)"/>
  <!-- Neck + body -->
  <ellipse cx="50" cy="85" rx="22" ry="20" fill="#f5c9b0"/>
  <!-- Face -->
  <ellipse cx="50" cy="55" rx="21" ry="23" fill="#f5c9b0"/>
