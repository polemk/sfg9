nro_contrato: "Número do contrato da operação no portador. É identificação — serve para localizar e ordenar a operação e não entra em nenhum cálculo."
titulo: "Nome da operação na lista. Se ficar em branco, a operação passa a se chamar como o portador."
carrier_id: "Portador da operação. Aqui é só o portador do contrato: operação estruturada não consome limite de risco."
operation_type_id: "Tipo da operação. É por ele que o recibo encontra a remuneração cadastrada no projeto — sem remuneração para este tipo, a operação não pode ser faturada."
company_id: "Empresa da operação. É ela que define o projeto do registro."
description: "Texto livre sobre a operação, gravado como observação. Não entra em nenhum cálculo."
issue_date: "Data de emissão, obrigatória. É a data que o recibo assume ao faturar a operação; não entra no cálculo da remuneração."
due_date: "Vencimento, obrigatório. É informação de controle: não entra no valor da remuneração, que é um percentual fechado sobre o capital, sem proporção por prazo."
operation_value: "Capital da operação, obrigatório. É a base inteira da remuneração — o recibo vale este capital multiplicado pelo percentual da remuneração do projeto."
balance: "Saldo inicial da operação, sempre gravado como valor negativo. O saldo da operação é igual a ele e é reescrito a cada gravação: não existe baixa de saldo em operação estruturada."
agreed_rate: "Taxa acordada da operação, em percentual. É registro do que foi combinado — o valor faturado sai do percentual da remuneração do projeto, não desta taxa."
is_on_variable: "Marcador de cadastro da operação. Fica gravado e exibido — nenhum cálculo do sistema o lê: não altera saldo e não afeta o faturamento. Quem apura o variável faz isso fora do sistema."
is_ended: "Marca a operação como encerrada. É marcador de cadastro: não bloqueia o faturamento, não altera o saldo e não filtra a lista."
