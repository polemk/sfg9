nro_contrato: "Número do contrato da operação no portador. É identificação — serve para localizar e ordenar a operação e não entra em nenhum cálculo."
titulo: "Nome da operação na lista. Se ficar em branco, a operação passa a se chamar como o portador."
carrier_id: "Portador da operação. Junto com empresa e tipo, é a chave que localiza o limite de risco que a operação vai consumir — sem limite cadastrado para essa combinação a operação não salva."
operation_type_id: "Tipo da operação. Define o limite consumido e o subtipo, que decide se o saldo entra no bloco liquidável ou no de pré-faturamento do painel de risco. Em tipo sem pré-faturamento, a criação já gera o movimento de liberação de recurso com o capital da operação."
company_id: "Empresa que toma a operação. Define o projeto do registro e entra na chave do limite de risco."
description: "Texto livre sobre a operação, gravado como observação e copiado para a renovação. Não entra em nenhum cálculo."
issue_date: "Data de emissão, obrigatória. A operação só conta na exposição do painel entre esta data e o vencimento, e é ela que data o movimento automático de liberação de recurso."
due_date: "Vencimento, obrigatório. Fora da janela entre emissão e vencimento a operação deixa de somar no limite utilizado; prorrogar altera esta data e o vencimento original fica guardado."
operation_value: "Capital da operação, obrigatório. É o valor do movimento de liberação de recurso gerado na criação e a base do recibo — a remuneração é um percentual dele."
balance: "Saldo com que a operação nasce. É sempre gravado como valor negativo, e os movimentos lançados depois somam sobre ele para dar o saldo que consome o limite."
agreed_rate: "Taxa acordada da operação, em percentual. Vem preenchida com a taxa do limite quando a operação nasce do próprio limite, e com a taxa nominal do borderô quando nasce de um recebível; é registro, não base da remuneração."
is_on_variable: "Marcador de cadastro da operação. Fica gravado e é copiado para a operação nova na renovação — nenhum cálculo do sistema o lê: não altera saldo, não altera o limite utilizado e não afeta o faturamento. Quem apura o variável faz isso fora do sistema."
is_ended: "Marca a operação como encerrada. No painel de risco o saldo passa do bloco a vencer para o de vencidos; a operação continua somando no limite utilizado e continua aceitando movimento e prorrogação."
