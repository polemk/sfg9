date: "Data da operação, obrigatória. É ela que data o movimento de liberação de recurso e vira a data de emissão da operação de risco gerada por este borderô; não entra em nenhum cálculo de custo."
project_id: "Projeto dono do borderô. Define a marca de gestão Safegold do lançamento e entra na chave que procura o limite de risco da empresa no portador."
carrier_id: "Portador que comprou os títulos. Junto com empresa, projeto e tipo de operação, é a chave que localiza o limite de risco — sem limite cadastrado para essa combinação o borderô não salva."
company_id: "Empresa cedente dos títulos. Entra na chave do limite de risco e é a empresa cujo prazo médio ponderado alimenta o custo efetivo."
wallet_id: "Carteira em que o borderô é classificado. Serve para filtrar e ordenar a lista; não entra em nenhuma conta."
receivable_kind_id: "Classificação do recebível. Obrigatória para salvar, mas não altera nenhum valor do borderô."
resource_source_id: "Origem e utilização dos recursos do borderô. Obrigatória para salvar; é classificação e não afeta os valores calculados."
nro_bordero: "Número do borderô no portador. Aceita apenas dígitos e é copiado como número de contrato da operação de risco gerada por este lançamento."
qtd_titulos: "Quantidade de títulos enviados. Menos a quantidade recusada, dá a quantidade final; nenhum valor em dinheiro é derivado dela."
valor_bruto: "Valor de face dos títulos enviados. Menos o bruto recusado, forma o bruto final — a base de todas as tarifas, do IOF e de todos os custos efetivos."
qtd_recusada: "Quantidade de títulos que o portador recusou. É subtraída da quantidade enviada; em branco vale zero."
vlr_bruto_recusado: "Valor de face dos títulos recusados. É subtraído do valor bruto para formar o bruto final; em branco vale zero, e informar a mais encolhe a base de todo o cálculo."
vlr_bruto_final: "Bruto menos bruto recusado, calculado automaticamente. É a base sobre a qual incidem tarifas, IOF e todos os custos efetivos."
qtd_final: "Quantidade enviada menos a recusada, calculada automaticamente."
prz_med_pond_emp: "Prazo médio ponderado dos títulos pela ótica da empresa, em dias. Somado ao float acordado, é o prazo que desconta o custo efetivo da empresa e o líquido correto — errar aqui move todos os percentuais de custo do borderô."
prz_med_pond_bco: "Prazo médio ponderado pela ótica do portador, em dias. Define o float calculado, a base do IOF e o custo efetivo do banco; se ficar menor que o prazo da empresa, o float calculado sai negativo."
float_calculado: "Prazo do banco menos prazo da empresa, calculado automaticamente. É o float que o portador de fato praticou, para comparar com o acordado."
float_acordado: "Dias de float negociados com o portador. É somado ao prazo médio em todos os custos efetivos com float e no líquido correto — quanto maior o float, menor o custo mensal apurado."
diferenca_float: "Quanto o float calculado excede o acordado. Só mostra a diferença positiva: se o portador praticou float menor que o combinado, o campo fica zerado."
checagem_iof: "IOF esperado, para conferir contra o IOF que o portador cobrou: 0,0041% ao dia sobre o prazo do banco mais 0,38% fixo, aplicados ao bruto final já sem ad valorem e sem deságio."
valor_total_tarifas: "Soma de todas as tarifas lançadas: ad valorem, deságio, IOF e outras. É o que se subtrai do bruto final para chegar ao líquido."
valor_liquido: "Bruto final menos o total de tarifas. É o valor que o portador credita e o denominador de todos os custos efetivos — tarifa esquecida aparece como custo efetivo menor que o real."
cst_efetivo_acordado: "Custo efetivo mensal combinado com o portador, em percentual. Dele sai o líquido correto, e a diferença contra o líquido apurado é o que classifica o borderô como OK ou Diferença."
calc_valor_liq_correto: "Líquido que o borderô deveria ter pelo custo efetivo acordado: a taxa é convertida para o dia, multiplicada pelo bruto final e pelo prazo da empresa mais o float, e esse desconto sai do bruto — é desconto linear, dia a dia, não composto."
dif_calc_vlr_liq: "Líquido apurado menos líquido correto. Negativo significa que o portador creditou menos do que o custo acordado justifica, e é o que marca o borderô como Diferença."
status: "Preenchido sozinho: Diferença quando o líquido apurado fica abaixo do líquido correto, OK em qualquer outro caso — inclusive quando o crédito veio acima do acordado."
recompra: "Valor devolvido ao portador a título de recompra. Sai do líquido para formar o líquido recebido e é convertido em percentual sobre o líquido."
retencao: "Valor retido pelo portador. Sai do líquido para formar o líquido recebido e é convertido em percentual sobre o líquido."
fomento: "Parcela do líquido lançada como fomento. Entra no total de deduções e reduz o líquido recebido."
outros: "Qualquer outra dedução sobre o líquido. Entra no total de deduções e reduz o líquido recebido."
total_deducoes: "Soma de recompra, retenção, fomento e outros, calculada automaticamente."
vlr_liq_recebido: "Líquido menos as quatro deduções. É o dinheiro que efetivamente entra na empresa."
data_credito: "Data em que o portador credita o líquido. É copiada como vencimento da operação de risco gerada pelo borderô; sem ela essa operação não chega a ser criada, porque exige vencimento."
contrato: "Identificação do contrato ligado a este borderô, em texto livre. É só registro: fica gravado no lançamento, nenhuma tela o exibe e nenhum cálculo o lê."
observacoes: "Anotações livres sobre o borderô. Não entram em nenhuma conta."
tarifas_ad_valorem: "Soma automática das tarifas cujo tipo está marcado como ad valorem. Entra no total de tarifas e, junto com o deságio, é o que se abate da base do IOF de checagem."
tarifas_desagio: "Soma automática das tarifas marcadas como deságio. É o juro do borderô: sozinha ela dá as duas checagens de taxa nominal, e se ficar zerada as taxas nominais de deságio saem em branco."
tarifas_iof: "Soma automática das tarifas marcadas como IOF. É o valor a comparar com a checagem de IOF, e é o que volta para o líquido nos custos efetivos sem IOF."
tarifas_outras: "Tudo que foi lançado como tarifa e não é ad valorem, deságio nem IOF. Sai por diferença, então tarifa com o tipo errado cai aqui em vez de entrar na conta certa."
custo_efetivo_pz_med_banco: "Custo efetivo mensal pela ótica do portador: o desconto do bruto final sobre o líquido, elevado a 30 dias sobre o prazo do banco mais o float. Fica zerado se o prazo do banco for zero."
custo_efetivo_pz_med_emp: "Custo efetivo mensal pela ótica da empresa: o mesmo desconto, elevado a 30 dias sobre o prazo da empresa mais o float. É o número por onde a lista de recebíveis ordena o CET."
custo_efetivo_sem_float: "Mesmo custo efetivo da empresa, sem somar o float ao prazo. Mostra o custo puro do prazo dos títulos, sem a diluição que o float provoca."
movement_kind_id: "Tipo da tarifa lançada. É ele que decide em qual balde a tarifa cai — ad valorem, deságio, IOF ou outras — e, portanto, de quais taxas e custos efetivos ela participa."
recompra_percent: "Recompra em percentual do líquido, calculada automaticamente. Fica zerada quando a recompra está em branco."
retencao_percent: "Retenção em percentual do líquido, calculada automaticamente. Fica zerada quando a retenção está em branco."
fomento_percent: "Fomento em percentual do líquido, calculado automaticamente. Fica zerado quando o fomento está em branco."
outros_percent: "Outras deduções em percentual do líquido, calculadas automaticamente. Fica zerado quando o campo está em branco."
taxa_desconto_nominal_desagio_advalorem_bancos: "Taxa nominal mensal do deságio somado ao ad valorem, sobre o bruto final, ao prazo do banco. Sai em branco quando não há deságio lançado ou o líquido é menor que R$ 1,00."
taxa_desconto_nominal_despesas_bancos: "Taxa nominal mensal de todas as tarifas exceto o IOF, ao prazo do banco. Sai em branco quando não há IOF lançado ou o líquido é menor que R$ 1,00."
taxa_desconto_nominal_despesas_iof_bancos: "Taxa nominal mensal de todas as tarifas, IOF incluído, ao prazo do banco. É calculada sempre, sem a trava de valor mínimo que as outras duas têm."
custo_efetivo_pz_med_banco_sem_iof: "Custo efetivo do banco desconsiderando o IOF: o IOF volta para o líquido antes do desconto, e o prazo é o do banco mais o float. Zera quando o prazo médio da empresa é zero."
taxa_desconto_nominal_desagio_advalorem_emp: "Mesma taxa nominal de deságio mais ad valorem, agora ao prazo da empresa. Sai em branco quando não há deságio lançado ou o líquido é menor que R$ 1,00."
taxa_desconto_nominal_despesas_emp: "Taxa nominal mensal das tarifas exceto o IOF, ao prazo da empresa. Sai em branco quando não há IOF lançado ou o líquido é menor que R$ 1,00."
taxa_desconto_nominal_despesas_iof_emp: "Taxa nominal mensal de todas as tarifas, IOF incluído, ao prazo da empresa. É calculada sempre, sem trava de valor mínimo."
custo_efetivo_pz_med_emp_sem_iof: "Custo efetivo da empresa desconsiderando o IOF: o IOF volta para o líquido antes do desconto, ao prazo da empresa mais o float. Zera quando o prazo da empresa é zero."
custo_efetivo_com_float_total: "Custo efetivo da empresa com float. É a mesma conta do Efetivo Empresa, fechada em duas casas decimais em vez de quatro."
custo_efetivo_com_float_sem_iof: "Custo efetivo da empresa com float e sem IOF, fechado em duas casas. Sai em branco quando não há IOF lançado ou o líquido é menor que R$ 1,00."
multiplicador_pm_empresa: "Bruto final multiplicado pelo prazo médio da empresa, gravado automaticamente. Fica em branco se faltar qualquer um dos dois."
multiplicador_pm_float: "Bruto final multiplicado pelo prazo médio do banco. Apesar do nome, o float acordado não entra nesta conta."
nominal_tax: "Taxa nominal mensal combinada com o portador, em percentual. Não entra em nenhuma conta do borderô: é copiada como taxa acordada da operação de risco gerada e serve de referência para as duas checagens ao lado."
nominal_tax_check: "Taxa nominal que o deságio de fato representa: deságio sobre o bruto final, dividido pelo prazo da empresa em meses. É o número a comparar com o nominal acordado."
nominal_tax_check_with_float: "Mesma checagem, com o float acordado somado ao prazo da empresa. Quanto maior o float, menor a taxa que sai aqui."
description: "Texto livre sobre o borderô. Não entra em nenhuma conta."
risk_operation_type_id: "Tipo de operação de risco a que o borderô se vincula. Exige limite cadastrado para a empresa no portador — sem limite o borderô não salva — e decide se o líquido vira uma operação de risco nova ou um movimento de liberação na operação de pré-faturamento existente."
